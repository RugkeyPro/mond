name: TestFlight (计算器伪装版)

# ─────────────────────────────────────────────────────────────────────────────
# 触发条件
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - disguise/calculator
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: "跳过 TestFlight 上传（仅构建 IPA）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: testflight-disguise-latest
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# 必需的 GitHub Secrets（在仓库 Settings → Secrets → Actions 中配置）
#
#   ASC_API_KEY_ID            App Store Connect API Key ID（例如 ABCDEF1234）
#   ASC_API_ISSUER_ID         Issuer ID（UUID 格式）
#   ASC_API_KEY_BASE64        .p8 私钥文件的 Base64 内容
#                             生成方式: base64 -i AuthKey_XXXX.p8 | tr -d '\n'
#
#   DIST_CERT_P12_BASE64      发布证书 .p12 的 Base64 内容
#                             生成方式: base64 -i Certificates.p12 | tr -d '\n'
#   DIST_CERT_PASSWORD        .p12 导出时设置的密码
#
#   PROVISIONING_PROFILE_BASE64
#                             App Store Distribution 描述文件 .mobileprovision 的 Base64
#                             生成方式: base64 -i xxx.mobileprovision | tr -d '\n'
#   PROVISIONING_PROFILE_UUID
#                             描述文件 UUID（从 security cms -D -i xxx.mobileprovision 获取）
#
#   APP_BUNDLE_ID             伪装版 Bundle ID，例如: com.yourname.calc
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      # ── 1. 检出代码 ─────────────────────────────────────────────────────────
      - name: Checkout (disguise/calculator)
        uses: actions/checkout@v4
        with:
          ref: disguise/calculator

      # ── 2. 安装签名证书到临时 Keychain ─────────────────────────────────────
      - name: 安装发布证书
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD:   ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "✅ 证书安装完成"

      # ── 3. 安装描述文件 ─────────────────────────────────────────────────────
      - name: 安装 App Store Distribution 描述文件
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_UUID:   ${{ secrets.PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          PP_PATH="$PP_DIR/${PROVISIONING_PROFILE_UUID}.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          echo "PP_PATH=$PP_PATH" >> "$GITHUB_ENV"
          echo "✅ 描述文件已安装"

      # ── 4. 配置 App Store Connect API Key ──────────────────────────────────
      - name: 配置 ASC API Key
        env:
          ASC_API_KEY_ID:     ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "✅ ASC API Key 配置完成"

      # ── 5. 将显示名称改为「计算器」────────────────────────────────────────
      - name: 设置 App 显示名称为「计算器」
        run: |
          set -euo pipefail
          PBXPROJ="mond.xcodeproj/project.pbxproj"
          # 注入 INFOPLIST_KEY_CFBundleDisplayName（Xcode 13+ build settings 方式）
          if grep -q "INFOPLIST_KEY_CFBundleDisplayName" "$PBXPROJ"; then
            sed -i '' \
              's|INFOPLIST_KEY_CFBundleDisplayName = .*|INFOPLIST_KEY_CFBundleDisplayName = "计算器";|g' \
              "$PBXPROJ"
          else
            # 在每个 Release configuration block 中插入
            sed -i '' \
              '/PRODUCT_NAME = mond;/a\
          \t\t\t\tINFOPLIST_KEY_CFBundleDisplayName = "计算器";' \
              "$PBXPROJ"
          fi
          echo "✅ 显示名称已设置"

      # ── 6. 更新 Bundle ID ──────────────────────────────────────────────────
      - name: 更新 Bundle Identifier
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          set -euo pipefail
          PBXPROJ="mond.xcodeproj/project.pbxproj"
          sed -i '' \
            "s|PRODUCT_BUNDLE_IDENTIFIER = \"[^\"]*\";|PRODUCT_BUNDLE_IDENTIFIER = \"${APP_BUNDLE_ID}\";|g" \
            "$PBXPROJ"
          echo "✅ Bundle ID 已更新为: $APP_BUNDLE_ID"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ"

      # ── 7. 生成 ExportOptions.plist ────────────────────────────────────────
      - name: 生成 ExportOptions.plist
        env:
          APP_BUNDLE_ID:             ${{ secrets.APP_BUNDLE_ID }}
          PROVISIONING_PROFILE_UUID: ${{ secrets.PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST
          echo "✅ ExportOptions.plist 已生成"

      # ── 8. xcodebuild archive ──────────────────────────────────────────────
      - name: xcodebuild archive（签名构建）
        env:
          APP_BUNDLE_ID:             ${{ secrets.APP_BUNDLE_ID }}
          PROVISIONING_PROFILE_UUID: ${{ secrets.PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          xcodebuild -version

          xcodebuild archive \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mond_calc.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="${PROVISIONING_PROFILE_UUID}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
            | tee build_archive.log

          echo "✅ Archive 完成"

      # ── 9. 修复 BAExtension NSExtensionPrincipalClass ─────────────────────
      - name: 修复 BAExtension Info.plist
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/mond_calc.xcarchive"
          APP_PATH="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          APPEX_PLIST="$APP_PATH/PlugIns/BAExtension.appex/Info.plist"
          if [ -f "$APPEX_PLIST" ]; then
            if /usr/libexec/PlistBuddy -c \
              "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX_PLIST" 2>/dev/null; then
              /usr/libexec/PlistBuddy -c \
                "Delete :NSExtension:NSExtensionPrincipalClass" "$APPEX_PLIST"
              echo "✅ NSExtensionPrincipalClass 已移除"
            fi
          fi

      # ── 10. Export IPA ────────────────────────────────────────────────────
      - name: xcodebuild -exportArchive
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mond_calc.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            | tee build_export.log

          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          cp "$IPA_PATH" mond_calc_testflight.ipa
          shasum -a 256 mond_calc_testflight.ipa | tee mond_calc_testflight.ipa.sha256
          echo "✅ IPA 导出完成"

      # ── 11. 上传到 TestFlight ─────────────────────────────────────────────
      - name: 上传到 TestFlight
        if: ${{ !inputs.skip_testflight }}
        env:
          ASC_API_KEY_ID:    ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file mond_calc_testflight.ipa \
            --apiKey  "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose \
            2>&1 | tee testflight_upload.log
          echo "✅ TestFlight 上传完成！请前往 App Store Connect → TestFlight 查看。"

      # ── 12. 同时构建无签名版（供 TrollStore / AltStore 用户）────────────
      - name: 构建无签名版 IPA（备用）
        if: ${{ inputs.skip_testflight == true }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build | tee build_unsigned.log

          PRODUCTS=build_unsigned/Build/Products/Release-iphoneos
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)"
          APPEX_PATH="$(find "$PRODUCTS" -maxdepth 1 -name 'BAExtension.appex' -print -quit)"

          if [ -n "$APPEX_PATH" ] && [ ! -d "$APP_PATH/PlugIns/BAExtension.appex" ]; then
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
          fi

          # 修复 BAExtension
          APPEX_PLIST="$APP_PATH/PlugIns/BAExtension.appex/Info.plist"
          if [ -f "$APPEX_PLIST" ]; then
            /usr/libexec/PlistBuddy -c \
              "Delete :NSExtension:NSExtensionPrincipalClass" "$APPEX_PLIST" 2>/dev/null || true
          fi

          # Ad-hoc 签名（附 no-sandbox entitlements）
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>com.apple.private.security.no-sandbox</key>\n\t<true/>\n\t<key>platform-application</key>\n\t<true/>\n\t<key>com.apple.private.skip-library-validation</key>\n\t<true/>\n</dict>\n</plist>\n' > ent_unsigned.plist
          codesign --force --deep --sign - --entitlements ent_unsigned.plist "$APP_PATH"

          rm -rf Payload mond_calc_unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload mond_calc_unsigned.ipa
          rm -rf Payload

          shasum -a 256 mond_calc_unsigned.ipa | tee mond_calc_unsigned.ipa.sha256
          echo "✅ 无签名 IPA 构建完成"

      # ── 13. 上传 GitHub Artifacts ────────────────────────────────────────
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mond-calculator-disguise-build
          path: |
            mond_calc_testflight.ipa
            mond_calc_testflight.ipa.sha256
            mond_calc_unsigned.ipa
            mond_calc_unsigned.ipa.sha256
            testflight_upload.log
            build_archive.log
            build_export.log
          if-no-files-found: warn

      # ── 14. 发布到 GitHub Release ────────────────────────────────────────
      - name: 发布到 GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="calc-disguise-latest"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          FILES=""
          [ -f mond_calc_testflight.ipa ]  && FILES="$FILES mond_calc_testflight.ipa mond_calc_testflight.ipa.sha256"
          [ -f mond_calc_unsigned.ipa ]    && FILES="$FILES mond_calc_unsigned.ipa mond_calc_unsigned.ipa.sha256"
          gh release create "$TAG" $FILES \
            --target "${GITHUB_SHA}" \
            --title "计算器伪装版 (Calculator Disguise)" \
            --notes "**分支**: \`disguise/calculator\` | **Commit**: \`${GITHUB_SHA}\`

          ### 安装说明
          - **TestFlight**：上传完成后，在 App Store Connect → TestFlight 邀请测试人员即可安装
          - **TrollStore / AltStore**：使用 \`mond_calc_unsigned.ipa\`（无签名版，仅在 skip_testflight 时构建）

          ### 使用方法
          1. 安装后，App 图标与名称显示为「**计算器**」
          2. 打开 App，外观与系统计算器完全相同，可正常计算
          3. 输入 \`102\`，再按 \`=\`，即可进入真实 mond 功能界面
          4. 按左上角 ↓ 箭头可返回计算器伪装界面
          "

      # ── 15. 清理临时 Keychain ────────────────────────────────────────────
      - name: 清理 Keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          echo "✅ Keychain 已清理"
