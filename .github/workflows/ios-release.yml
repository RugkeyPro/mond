name: build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-latest
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build | tee build.log

          PRODUCTS=build/Build/Products/Release-iphoneos
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"

          # Embed BAExtension.appex if Xcode skipped the copy phase
          APPEX_PATH="$(find "$PRODUCTS" -maxdepth 1 -name 'BAExtension.appex' -print -quit)"
          if [ -n "$APPEX_PATH" ] && [ ! -d "$APP_PATH/PlugIns/BAExtension.appex" ]; then
            echo ":: Manually embedding BAExtension.appex"
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
          fi

          # Patch Info.plist: inject UIBackgroundModes if missing
          # (Xcode's auto-generated plist omits this under CODE_SIGNING_ALLOWED=NO)
          PLIST="$APP_PATH/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null; then
            echo ":: Injecting UIBackgroundModes into Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string background-download" "$PLIST"
          fi
          echo ":: Info.plist UIBackgroundModes:"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

          # Strip NSExtensionPrincipalClass from BAExtension Info.plist
          # ROOT CAUSE: installd validates this ObjC class name at install time.
          # The Swift-qualified name 'BAExtension.BAExtensionDelegate' is not a valid
          # ObjC class name, so installd rejects the entire app bundle.
          # The working BF0QN reference app omits this key entirely.
          APPEX_PLIST="$APP_PATH/PlugIns/BAExtension.appex/Info.plist"
          if [ -f "$APPEX_PLIST" ]; then
            if /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX_PLIST" 2>/dev/null; then
              echo ":: Removing NSExtensionPrincipalClass from BAExtension/Info.plist"
              /usr/libexec/PlistBuddy -c "Delete :NSExtension:NSExtensionPrincipalClass" "$APPEX_PLIST"
            fi
            echo ":: BAExtension NSExtension:"
            /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APPEX_PLIST"
          fi

          echo ":: Final app bundle contents:"
          find "$APP_PATH" -maxdepth 2 -print

          # Create entitlements.plist for jailbreak/unsandboxed file system access
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>com.apple.private.security.no-sandbox</key>\n\t<true/>\n\t<key>platform-application</key>\n\t<true/>\n\t<key>com.apple.private.skip-library-validation</key>\n\t<true/>\n</dict>\n</plist>\n' > entitlements.plist
          echo ":: Ad-hoc signing with no-sandbox entitlements"
          codesign --force --deep --sign - --entitlements entitlements.plist "$APP_PATH"
          # Also embed entitlements.plist IN the .app bundle so signing tools can find it
          cp entitlements.plist "$APP_PATH/entitlements.plist"
          echo ":: entitlements.plist embedded in app bundle"

          rm -rf Payload mond.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload mond.ipa
          rm -rf Payload

      - name: verify ipa
        run: |
          set -euo pipefail
          unzip -t mond.ipa
          unzip -Z1 mond.ipa | grep -Eq '^Payload/[^/]+\.app/[^/]+$'

          # Verify BAExtension.appex is embedded
          if ! unzip -Z1 mond.ipa | grep -q 'PlugIns/BAExtension.appex/'; then
            echo "::error::BAExtension.appex is NOT embedded in the IPA!"
            unzip -Z1 mond.ipa
            exit 1
          fi
          echo ":: BAExtension.appex verified OK"

          shasum -a 256 mond.ipa | tee mond.ipa.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mond-mdm-delete-v1.6-build7-unsigned
          path: |
            mond.ipa
            mond.ipa.sha256
          if-no-files-found: error

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest mond.ipa mond.ipa.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Latest" \
            --notes "Automated build from ${GITHUB_SHA}"
