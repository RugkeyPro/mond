name: build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-latest
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build | tee build.log

          PRODUCTS=build/Build/Products/Release-iphoneos
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"

          # Embed BAExtension.appex if Xcode skipped the copy phase
          APPEX_PATH="$(find "$PRODUCTS" -maxdepth 1 -name 'BAExtension.appex' -print -quit)"
          if [ -n "$APPEX_PATH" ] && [ ! -d "$APP_PATH/PlugIns/BAExtension.appex" ]; then
            echo ":: Manually embedding BAExtension.appex"
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
          fi

          echo ":: Final app bundle contents:"
          find "$APP_PATH" -maxdepth 2 -print

          rm -rf Payload mond.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload mond.ipa
          rm -rf Payload

      - name: verify ipa
        run: |
          set -euo pipefail
          unzip -t mond.ipa
          unzip -Z1 mond.ipa | grep -Eq '^Payload/[^/]+\.app/[^/]+$'

          # Verify BAExtension.appex is embedded
          if ! unzip -Z1 mond.ipa | grep -q 'PlugIns/BAExtension.appex/'; then
            echo "::error::BAExtension.appex is NOT embedded in the IPA!"
            unzip -Z1 mond.ipa
            exit 1
          fi
          echo ":: BAExtension.appex verified OK"

          shasum -a 256 mond.ipa | tee mond.ipa.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mond-mdm-delete-v1.6-build7-unsigned
          path: |
            mond.ipa
            mond.ipa.sha256
          if-no-files-found: error

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest mond.ipa mond.ipa.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Latest" \
            --notes "Automated build from ${GITHUB_SHA}"
